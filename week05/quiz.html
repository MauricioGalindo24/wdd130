<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML and CSS Quiz</title>
    <meta name="description" content="A basic HTML and CSS quiz form.">
    <meta name="author" content="Mauricio Galindo">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>
            <div class="form-item">
                <label for="q1"><span>1.</span> What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="form-item">
                <label for="q2"><span>2.</span> How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>

            <div class="form-item">
                <label for="q3"><span>3.</span> Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="slash-star">/* This is a comment */</option>
                    <option value="double-slash">// This is a comment</option>
                    <option value="html-comment">&lt;!-- This is a comment --&gt;</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4"><span>4.</span> What is the bottom margin given this declaration? <code>margin: 10px 5px 15px;</code></label>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>

    <footer>
        <p>©2026 | Basic HTML and CSS Quiz | Mauricio Galindo</p>
    </footer>
</body>

</html>
